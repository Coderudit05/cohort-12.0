<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio input</title>
  </head>
  <body>
    <form>
      <input type="text" placeholder="Enter Your Name" />

      <p>Gender :</p>
      <input type="radio" name="gender" value="male" /> Male
      <input type="radio" name="gender" value="female" /> Female
      <input type="radio" name="gender" value="xyz" /> xyz
      <input type="radio" name="gender" value="other" /> Other


      <p>Subjects :</p>
      <input type="radio" name="subject" value="maths" /> Maths
      <input type="radio" name="subject" value="bio" /> bio
      <input type="radio" name="subject" value="commerce" /> commerce
      <input type="radio" name="subject" value="arts" /> arts
    </form>

    <br><br>
    
  </body>
</html>
