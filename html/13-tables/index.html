<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Tables</title>
  </head>
  <body>
    <!-- tr -> table row -->
    <!-- td -> table data -->
    <table border="1">
      <tr>
        <td>Skills</td>
        <td>Name</td>
        <td>Age</td>
    </tr>
    <tr>
        <td>HTML</td>
        <td>Udit</td>
        <td>78</td>
    </tr>
    <tr>
        <td>CSS</td>
        <td>Ravi</td>
        <td>90</td>
    </tr>
    <tr>
        <td>JavaScript</td>
        <td>Kishan</td>
        <td>100</td>
      </tr>
    </table>
  </body>
</html>
