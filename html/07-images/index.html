<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Images in html</title>
  </head>
  <body>
    <img
      src="https://i.pinimg.com/1200x/87/17/e1/8717e10f1de9cece362988c51616a4cd.jpg"
      alt="jakar aache se address dalkar aaja phle"
      height="600"

    />

        src attribute : this is source attibute
        alt attribute : this is (alternative) used when your image is not loaded due to server error or somethign else
        title attribute : this is used to add title on the images and when we hove it is shown
    -->
  </body>
