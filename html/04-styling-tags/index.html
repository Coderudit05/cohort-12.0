<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styling Tags</title>
  </head>
  <body>
    <!-- b -> bold tag is non-sematic tag means 
     if we want to bold any text which usually does not contains any meaning -->

    <!-- strong -> strong tag are the sematic (meaningful) tag means 
      if we want to bold something which have some meaning then we can bold it using strong tag -->
    <p>
      Hello this is <i><b>Udit Namdev</b></i
      >. I am from <b>Bhopal</b>. Bhopal is very <em><b>Beautiful</b></em> city.
    </p>
    <p>
      Hello this is <strong>Udit Namdev</strong>. I am from
      <strong>Bhopal</strong>. Bhopal is very <strong>Beautiful</strong> city.
    </p>


    
  </body>
</html>
