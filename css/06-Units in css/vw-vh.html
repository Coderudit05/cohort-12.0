<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vw & vh</title>
    <style>
      /* vw -> ViewPort Width
         vh -> ViewPort Height

         100 vh -> full screen height
         100 vw -> full screen width
      */
      .box{
        height: 50vh;
        width: 50vh;
        background-color: violet;
      }
    </style>
  </head>
  <body>

    <div class="box"></div>


  </body>
</html>
