<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Units in CSS</title>
    <style>
      .box {
        height: 500px;
        width: 500px;
        background-color: purple;
      }
    </style>
  </head>
  <body>
    <!-- 
    1) Absolute Units (fixed): Those units who are having fixed length means they can not be changed
    a) px -> 1/96 part of 1 inch

    2) Relative Units (depended on the parent) : Those units who can vary with depends on their parent.
    a) %
    b) rem , em , vw,vh,max-vh,max-vw,min-vh,min-vh
     -->

    <div class="box"></div>
  </body>
</html>
