<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rem unit in CSS</title>
    <style>
        /* Who is the root element of all the html elements -> HTML Tag */

        html{
            font-size: 30px;
        }
        .box{
            font-size: 30px;
            height: 10rem;
            width: 10rem;
            background-color: blueviolet;
        }
    </style>
</head>
<body>

    <div class="box">
        Hello I am box

    </div>
    
</body>
</html>
