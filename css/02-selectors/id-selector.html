<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Id Selector</title>
    <style>
      #text1 {
        background-color: purple;
        color: white;
      }

      #text2{
        background-color: brown;
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- 
    What is Id 

    You will use '#' as prefix for id selector

    When you want to identify any HTML Element uniquely then you will use ID Selector
    ID selector helps use to find the unique element
    We provide the unique id to every html element
    
    Note : We never give same id to 2 or more than 2 elements

    Real Life Examples : 
    1) Your Aadhar Card no.
    2) Your voter id card
    3) Your PAN Card no.
    4) Your Roll no.
    5) Your Vehical no.

     -->

    <h1 id="text1">This is h1</h1>
    <h2 id="text2">This is h2</h2>
    <h3 id="text3">This is h3</h3>
    <h4 id="text4">This is h4</h4>
    <p id="para">This is para</p>
    <span id="subText">This is span</span>
    <div id="box">This is div</div>
  </body>
</html>
