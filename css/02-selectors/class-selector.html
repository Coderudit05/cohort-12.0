<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Selector</title>

    <style>
      /*      Universal Selector  */
      * {
        color: yellowgreen;
      }

       .batchA{
        color: blueviolet;
      }


      .sectionA{
        color: peru;

      }

     
      

    </style>
  </head>
  <body>
    I am inside the body
    <h1 class="sectionA batchA">This is h1</h1>
    <h2>This is h2</h2>
    <h3>This is h3</h3>
    <h4 class="sectionA batchB">This is h4</h4>

    <p>This is paragraph</p>
    <div>This is div</div>
    <span class="sectionA batchA">This is Span</span>
  </body>
</html>
