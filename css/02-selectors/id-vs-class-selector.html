<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class vs Id Selector</title>
    <style>
      .text {
        background-color: brown;
        color: white;
      }

      #text4 {
        background-color: aquamarine;
        color: brown;
      }
    </style>
  </head>
  <body>
    <!-- Id Selector vs Class Selectors  -->

    <!-- 
    
    ID Selector : 1) ID Selector selects the unique element
                2) one element -> one id
                3)




    Class Selector : 
            1) Class Selector can selector individual or group of elements
            2) one class -> many elements
            3)
    
    
    -->
    <h1 class="text" id="text1">This is h1</h1>
    <h2 class="text" id="text2">This is h2</h2>
    <h3 class="text" id="text3">This is h3</h3>
    <h4 id="text4">This is h4</h4>
    <p id="para">This is para</p>
    <span id="subText">This is span</span>
    <div id="box">This is div</div>

    
  </body>
</html>
